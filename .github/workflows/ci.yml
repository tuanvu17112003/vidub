# CI for ViDub. Local equivalent of the test job:
#   .venv/Scripts/python.exe -m ruff check vidub tests scripts tools
#   .venv/Scripts/python.exe -m pytest -m "not slow" -q
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  issues: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
      - run: ruff check vidub tests scripts tools
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (the timing tests exercise real ffmpeg)
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          else
            choco install ffmpeg -y --no-progress
            echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # Optional-dependency tests must keep skipping cleanly offline (no
      # network in CI); none may require a download to pass.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "not slow" -q --tb=line 2>&1 | tee pytest.log
      - name: Publish failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tail -60 pytest.log >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "${{ github.repository }}" \
            --title "CI failure ${{ github.sha }} (${{ matrix.os }})" \
            --body "$(tail -60 pytest.log)" || true
  build:
    # CD stage: every tag build publishes installable wheels as workflow
    # artifacts. Publishing to a package index is deliberately NOT wired (no
    # registry/secrets exist); wire it only when the user asks.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
